services:
  db:
    image: postgres:17
    container_name: movie_postgres_db
    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  test_db:
    image: postgres:17
    container_name: movie_postgres__docker_test_db
    env_file:
      - test.env

  api:
    build: .
    container_name: movie_api

    env_file:
      - .env
      - test.env

    ports:
      - "8000:8000"

    depends_on:
      - db
      - test_db

volumes:
  postgres-data:

